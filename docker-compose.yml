version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: vulnshop-postgres
    environment:
      POSTGRES_USER: vulnshop
      POSTGRES_PASSWORD: vulnerable123
      POSTGRES_DB: vulnshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  mongodb:
    image: mongo:6
    container_name: vulnshop-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: vulnshop
      MONGO_INITDB_ROOT_PASSWORD: vulnerable123
      MONGO_INITDB_DATABASE: vulnshop
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  redis:
    image: redis:7-alpine
    container_name: vulnshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vulnshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  # Microservices
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: vulnshop-auth-service
    environment:
      - PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnshop
      - POSTGRES_PASSWORD=vulnerable123
      - POSTGRES_DB=vulnshop
      - JWT_SECRET=secret123
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: vulnshop-user-service
    environment:
      - PORT=3002
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=vulnshop
      - MONGO_PASSWORD=vulnerable123
      - MONGO_DB=vulnshop
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: vulnshop-product-service
    environment:
      - PORT=3003
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnshop
      - POSTGRES_PASSWORD=vulnerable123
      - POSTGRES_DB=vulnshop
      - FLASK_DEBUG=1
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: vulnshop-order-service
    environment:
      - PORT=3004
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=vulnshop
      - POSTGRES_PASSWORD=vulnerable123
      - POSTGRES_DB=vulnshop
      - FLASK_DEBUG=1
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: vulnshop-payment-service
    environment:
      - PORT=3005
      - STRIPE_API_KEY=sk_test_vulnerable_key_12345
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: vulnshop-notification-service
    environment:
      - PORT=3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - FLASK_DEBUG=1
    ports:
      - "3006:3006"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: vulnshop-gateway
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - payment-service
      - notification-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vulnshop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnshop-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      # VULNERABILITY: Exposed API key in environment variable
      - REACT_APP_GOOGLE_MAPS_KEY=AIzaSyVulnerableKeyExample123
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    networks:
      - vulnshop-network

  nginx:
    image: nginx:alpine
    container_name: vulnshop-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - frontend
    networks:
      - vulnshop-network

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:

networks:
  vulnshop-network:
    driver: bridge
